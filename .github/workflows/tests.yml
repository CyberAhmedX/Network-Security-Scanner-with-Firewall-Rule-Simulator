name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -v

  # These change the real OS firewall, which is safe on GitHub's throwaway machines.
  real-firewall-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Test with real iptables (as root)
        run: sudo env "PATH=$PATH" REAL_FIREWALL=1 python -m pytest tests/test_real_firewall.py -v -rs

  real-firewall-windows:
    runs-on: windows-latest  # runs as Administrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Test with real Windows Firewall rules
        env:
          REAL_FIREWALL: '1'
        run: python -m pytest tests/test_real_firewall.py -v -rs

  # Feeds the scanner's SIEM events to a real Wazuh manager and checks which rule each one hits.
  wazuh-rules:
    name: Wazuh rules (real Wazuh manager)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Write a sample session with the app's own code
        run: SIEM_SAMPLE_OUT="$RUNNER_TEMP/session.ndjson" python -m pytest tests/test_siem.py -k sample -v
      - name: Start a Wazuh manager and load the NetScan rules
        run: |
          wait_for_analysisd() {
            for i in $(seq 1 60); do
              docker exec wazuh /var/ossec/bin/wazuh-control status 2>/dev/null | grep -q "wazuh-analysisd is running" && return 0
              sleep 5
            done
            docker exec wazuh /var/ossec/bin/wazuh-control status; return 1
          }
          # start with the image's own config first: mounting into /var/ossec/etc stops it being created
          docker run -d --name wazuh wazuh/wazuh-manager:4.14.9
          wait_for_analysisd
          docker cp siem/wazuh/netscan_rules.xml wazuh:/var/ossec/etc/rules/netscan_rules.xml
          docker exec wazuh chown root:wazuh /var/ossec/etc/rules/netscan_rules.xml
          docker exec wazuh chmod 660 /var/ossec/etc/rules/netscan_rules.xml
          docker exec wazuh /var/ossec/bin/wazuh-analysisd -t
          docker exec wazuh /var/ossec/bin/wazuh-control restart
          wait_for_analysisd
      - name: Check the sample session (includes the correlation rule)
        run: python siem/wazuh/check_rules.py wazuh "$RUNNER_TEMP/session.ndjson" --expect-correlation
      - name: Check the events from a real scan on Linux
        run: python siem/wazuh/check_rules.py wazuh siem/samples/real-session.ndjson
      - name: Wazuh logs
        if: failure()
        run: |
          docker logs wazuh 2>&1 | tail -60
          docker exec wazuh tail -60 /var/ossec/logs/ossec.log
